name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-organize files into correct Android project folders
        run: |
          mkdir -p app/src/main/java/com/reflow/screendraw
          mkdir -p app/src/main/res/values

          for f in build.gradle "build (1).gradle" "build(1).gradle"; do
            if [ -f "$f" ]; then
              if grep -q "com.android.application" "$f" 2>/dev/null; then
                mv "$f" app/build.gradle
              elif grep -q "buildscript" "$f" 2>/dev/null; then
                mv "$f" build.gradle.rootcopy
              fi
            fi
          done
          [ -f build.gradle.rootcopy ] && mv build.gradle.rootcopy build.gradle

          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/reflow/screendraw/MainActivity.kt
          [ -f DrawingView.kt ] && mv DrawingView.kt app/src/main/java/com/reflow/screendraw/DrawingView.kt
          [ -f OverlayService.kt ] && mv OverlayService.kt app/src/main/java/com/reflow/screendraw/OverlayService.kt
          [ -f IconFactory.kt ] && mv IconFactory.kt app/src/main/java/com/reflow/screendraw/IconFactory.kt
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/strings.xml

          echo "--- Final structure ---"
          find app -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDraw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
